<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spoken Text – Media Interaktif Fase E</title>
<style>
:root{--bg:#e9eff6;--stage:#f7f9fc;--surf:#fff;--ink:#10243a;--mute:#4d6178;--line:#cfd9e5;--pri:#1f6feb;--pri-ink:#fff;--soft:#e3edff;--hl:#ffc93c;--ok:#12803f;--okbg:#dcf5e5;--bad:#c62828;--badbg:#fde2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d14;--stage:#0f1b28;--surf:#162636;--ink:#e8f0f8;--mute:#9db1c6;--line:#2a3f55;--pri:#5b9bff;--pri-ink:#07121f;--soft:#1c3556;--hl:#ffc93c;--ok:#5fd68a;--okbg:#12361f;--bad:#ff8a8a;--badbg:#4a1c1c}}
:root[data-theme="dark"]{--bg:#070d14;--stage:#0f1b28;--surf:#162636;--ink:#e8f0f8;--mute:#9db1c6;--line:#2a3f55;--pri:#5b9bff;--pri-ink:#07121f;--soft:#1c3556;--ok:#5fd68a;--okbg:#12361f;--bad:#ff8a8a;--badbg:#4a1c1c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;background:var(--stage);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
header{height:68px;display:flex;align-items:center;gap:18px;padding:0 24px;background:var(--surf);border-bottom:2px solid var(--line)}
.brand{font-weight:700;font-size:21px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
nav{display:flex;gap:8px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--line);background:var(--surf);border-radius:12px;padding:8px 16px;font-size:15px;transition:transform .1s,background .15s}
button:hover{background:var(--soft)}button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
nav button{font-weight:600;padding:10px 26px;font-size:16px}
nav button.on,.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
nav button.on:hover,.pri:hover{background:var(--pri)}
.tools{display:flex;gap:8px}
.tools button{padding:8px 12px}
main{flex:1;padding:22px 28px;min-height:0;display:flex;gap:22px}
.card{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:20px 24px}
h2{margin:0 0 10px;font-size:25px}h3{margin:0 0 8px;font-size:18px}
p{margin:0 0 10px;line-height:1.55;font-size:16.5px}
.mute{color:var(--mute)}
mark{background:var(--hl);color:#10243a;padding:0 4px;border-radius:4px}
.col{display:flex;flex-direction:column;gap:16px;min-height:0}
.grow{flex:1;min-height:0}
/* teori */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.trio button{text-align:left;padding:14px 16px;border-radius:14px}
.trio button b{display:block;font-size:20px}.trio button span{font-size:13.5px;color:var(--mute)}
.trio button.on{background:var(--soft);border-color:var(--pri)}
.q{font-size:17px;font-weight:600;background:var(--soft);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--hl);color:#10243a;border-radius:999px;padding:5px 13px;font-size:14.5px;font-weight:600}
/* prosedur */
.steps{display:flex;gap:10px}.steps button{flex:1;padding:12px 6px;font-weight:600}
.steps button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.steps button.done{border-color:var(--ok)}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.big{font-size:19px!important}
/* lkpd */
.left{width:410px;flex:none}
.sel{display:flex;gap:8px}.sel button{flex:1;font-weight:600}.sel button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.wave{display:flex;align-items:center;gap:4px;height:54px;justify-content:center}
.wave i{width:7px;height:10px;border-radius:4px;background:var(--pri);opacity:.5}
.wave.go i{animation:w .7s ease-in-out infinite alternate;opacity:1}
@keyframes w{to{height:50px}}
@media (prefers-reduced-motion:reduce){.wave.go i{animation:none;height:30px}}
.tr{font-size:15.5px;line-height:1.5;background:var(--soft);border-radius:10px;padding:12px 14px}
.qs{display:flex;flex-direction:column;gap:12px}
.qb h3{font-size:16.5px;margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts button{font-size:14px;padding:9px 8px;line-height:1.3;text-align:center}
.opts button.sel1{background:var(--soft);border-color:var(--pri)}
.opts button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opts button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.score{font-size:19px;font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.side{width:214px;flex:none;display:flex;flex-direction:column;gap:8px}.side button{text-align:left;font-weight:600;padding:13px 14px;font-size:15px}.side button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}.tbl th,.tbl td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}.tbl th{background:var(--soft)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fc{min-height:118px;font-size:19px;font-weight:600}.fc.on{background:var(--soft);border-color:var(--pri)}
ul.l{margin:0;padding-left:20px;line-height:1.65;font-size:15.5px}
.exl{width:300px;flex:none;display:flex;flex-direction:column;gap:8px}.exl button{text-align:left;font-weight:600;padding:12px 14px}.exl button.on{background:var(--soft);border-color:var(--pri)}
button:disabled{opacity:.45;cursor:not-allowed}
.qopts{display:flex;flex-direction:column;gap:10px}.qopts button{text-align:left;font-size:18px;padding:14px 18px}
.qopts button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}.qopts button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
#toast{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--stage);padding:10px 22px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
#splash{position:absolute;inset:0;z-index:100;background:#7cc4f5;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.spbox{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:520px;background:rgba(255,255,255,.93);border:3px solid #1b3f91;border-radius:18px;padding:12px 18px;color:#10243a}
.splab{display:flex;justify-content:space-between;font-weight:700;font-size:16px;margin-bottom:8px}
.spbar{height:16px;border-radius:9px;background:#cfe0f5;overflow:hidden}
.spbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1f6feb,#ffc93c)}
.spgo{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);font-size:28px;font-weight:700;padding:14px 56px;border-radius:999px;background:#ffc93c;color:#10243a;border:4px solid #1b3f91;box-shadow:0 6px 0 #1b3f91;animation:pulse 1.2s ease-in-out infinite}
.spgo:hover{background:#ffd75e}
.spgo:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #1b3f91}
@keyframes pulse{50%{scale:1.06}}
.spm{position:absolute;top:14px;right:14px;z-index:2;font-size:20px;background:rgba(255,255,255,.92);color:#10243a;border-color:#1b3f91}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.spgo{animation:none}#splash{transition:none}}
</style>
</head>
<body>

  <header>
    <div class="brand">Spoken Text<small>Bahasa Inggris · Kelas X · Fase E</small></div>
    <nav id="nav"></nav>

      <button onclick="goSplash()" title="Kembali ke layar awal" aria-label="Kembali ke layar awal">🏠 Awal</button>

      <button onclick="fs()" title="Layar penuh" aria-label="Layar penuh">⛶</button>
      <button onclick="resetAll()" title="Reset semua" aria-label="Reset semua">↺ Reset</button>
    </div>
  </header>
  <main id="view"></main>
  <div id="toast"></div>

</div>
</div>
<script>
const TABS=[['teori','📘 Teori'],['prosedur','🧭 Prosedur'],['lkpd','📝 LKPD'],['kuis','🎯 Kuis']];
const THEORY=[
 {k:'Context',t:'Konteks',d:'Di mana, kapan, dan siapa yang berbicara.',q:'Where is this happening? Who is talking to whom?',ex:'“Attention, all students…” → pengumuman di sekolah oleh petugas kepada siswa.',w:['announcement','phone call','conversation','at school','at home','shop']},
 {k:'Purpose',t:'Tujuan',d:'Mengapa pembicara mengatakannya.',q:'Why does the speaker say this?',ex:'“Could you please heat up the rice?” → tujuan: meminta seseorang melakukan sesuatu.',w:['to inform','to invite','to ask','to offer','to remind','to thank']},
 {k:'Topic',t:'Topik',d:'Apa yang sedang dibicarakan.',q:'What is the talk mainly about?',ex:'Kata yang diulang atau ditekankan menunjukkan topik, misalnya “speech contest”.',w:['main idea','repeated words','key nouns','stress words','first sentence']}
];
const STEPS=[
 ['Prediksi','Sebelum mendengarkan','Baca judul dan lihat situasi. Tebak: siapa pembicara, di mana, dan tentang apa?','Tuliskan 1–2 tebakan di bukumu.'],
 ['Dengar I','Dengarkan keseluruhan','Dengarkan tanpa menulis. Tangkap gambaran umum: topik apa yang dibicarakan?','Fokus pada kata yang diulang.'],
 ['Dengar II','Cari petunjuk','Dengarkan lagi. Catat kata kunci tentang tempat, pembicara, dan alasan berbicara.','Perhatikan sapaan: “Attention, please”, “Hello, …”.'],
 ['Simpulkan','Tentukan jawaban','Gabungkan catatanmu: tentukan konteks, tujuan, dan topik. Cocokkan dengan pilihan jawaban.','Pilih jawaban yang didukung bukti kata kunci.'],
 ['Cek & Refleksi','Periksa dan renungkan','Buka transkrip, bandingkan dengan jawabanmu. Bagian mana yang masih sulit didengar?','Dengarkan ulang bagian yang meleset.']
];
const TEXTS=[
 {n:'Pengumuman',txt:'Attention, please. All students of class ten are asked to gather in the school hall at ten o’clock. The principal will give information about the English speech contest next Friday. Please bring your notebooks and be on time. Thank you.',
  c:'Petunjuk: “Attention, please”, “school hall”, “principal”.',
  qs:[['Konteks','Where is the announcement heard?',['At a school','At an airport','At a hospital'],0],['Tujuan','Why is the announcement made?',['To sell tickets','To ask students to gather','To say goodbye'],1],['Topik','What is the topic?',['A speech contest','A football match','A school trip'],0]]},
 {n:'Telepon',txt:'Hello, Dika. This is Mom. I will be late tonight because the bus is stuck in traffic. Could you please heat up the rice and the chicken in the fridge for dinner? Thanks, dear.',
  c:'Petunjuk: “Hello, Dika. This is Mom”, “Could you please…”.',
  qs:[['Konteks','Who is talking?',['A teacher and a student','A mother and her son','Two classmates'],1],['Tujuan','What does the speaker want?',['To ask Dika to heat dinner','To invite Dika out','To praise Dika'],0],['Topik','What is the talk about?',['A birthday party','Homework','Being late and dinner'],2]]},
 {n:'Toko',txt:'Good morning, and welcome to Fresh Market. Today we have a special offer on fruit. Apples and oranges are thirty percent off until noon. Please visit the fruit section on the second floor.',
  c:'Petunjuk: “welcome to Fresh Market”, “special offer”, “percent off”.',
  qs:[['Konteks','Where can you hear this?',['In a library','In a market','In a classroom'],1],['Tujuan','What is the purpose?',['To give a warning','To offer a discount','To say thanks'],1],['Topik','What is discounted?',['Vegetables','Shoes','Fruit'],2]]}
];
let S;
function init(){S={tab:'teori',sec:0,ex:0,fl:[],qi:0,qa:[],th:0,st:0,seen:[0],tx:0,ans:TEXTS.map(t=>t.qs.map(()=>null)),chk:[false,false,false],tr:[false,false,false],playing:false,mute:S?S.mute:false}}
init();
/* sound */
let AC;
function tone(f,d,type='sine',at=0,v=.12){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const t=AC.currentTime+at;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={click:()=>tone(660,.08,'triangle'),tab:()=>{tone(520,.08);tone(780,.1,'sine',.07)},ok:()=>{tone(660,.12);tone(880,.12,'sine',.1);tone(1175,.2,'sine',.2)},bad:()=>{tone(220,.25,'sawtooth',0,.08);tone(165,.3,'sawtooth',.15,.08)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',i*.12)),reset:()=>{tone(600,.1);tone(400,.15,'sine',.1)}};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800)}
function toggleMute(){S.mute=!S.mute;document.getElementById('mbtn').textContent=S.mute?'🔇':'🔊';if(!S.mute)sfx.click()}
function fs(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
function stopSpeech(){try{speechSynthesis.cancel()}catch(e){}S.playing=false}
function setTab(t){stopSpeech();S.tab=t;sfx.tab();render()}
function resetAll(){stopSpeech();init();sfx.reset();render();toast('Semua aktivitas direset')}
/* teori & prosedur */
function setTh(i){S.th=i;sfx.click();render()}
function setSt(i){S.st=Math.max(0,Math.min(STEPS.length-1,i));if(!S.seen.includes(S.st))S.seen.push(S.st);sfx.click();render()}
/* lkpd */
function setTx(i){stopSpeech();S.tx=i;sfx.click();render()}
function pick(q,o){if(S.chk[S.tx])return;S.ans[S.tx][q]=o;sfx.click();render()}
function showTr(){S.tr[S.tx]=!S.tr[S.tx];sfx.click();render()}
function play(){
  if(S.playing){stopSpeech();render();return}
  sfx.click();
  if(!('speechSynthesis' in window)){S.tr[S.tx]=true;render();toast('Suara tidak didukung peramban – baca transkrip');return}
  const u=new SpeechSynthesisUtterance(TEXTS[S.tx].txt);u.lang='en-US';u.rate=.9;
  u.onend=u.onerror=()=>{S.playing=false;render()};
  speechSynthesis.cancel();speechSynthesis.speak(u);S.playing=true;render()
}
function check(){
  const a=S.ans[S.tx];if(a.includes(null)){sfx.bad();toast('Jawab ketiga pertanyaan dulu');return}
  S.chk[S.tx]=true;const sc=a.filter((o,i)=>o===TEXTS[S.tx].qs[i][3]).length;
  sc===3?sfx.win():sc>0?sfx.ok():sfx.bad();render()
}
function resetTx(){stopSpeech();S.ans[S.tx]=[null,null,null];S.chk[S.tx]=false;S.tr[S.tx]=false;sfx.reset();render()}
function total(){let s=0;TEXTS.forEach((t,i)=>{if(S.chk[i])t.qs.forEach((q,j)=>{if(S.ans[i][j]===q[3])s++})});return s}
/* render */
function render(){
  document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  const v=document.getElementById('view');
  if(S.tab==='teori'){v.innerHTML=teoriView();}if(false){const t=THEORY[S.th];
    v.innerHTML=`<div class="card col" style="width:430px;flex:none"><h2>Apa itu spoken text?</h2>
    <p><mark>Spoken text</mark> adalah teks lisan: informasi yang disampaikan lewat suara, seperti percakapan, pengumuman, pesan telepon, atau monolog.</p>
    <p>Dalam kehidupan sehari-hari kita menemukannya di sekolah, toko, stasiun, dan rumah.</p>
    <p>Saat menyimak, kita mengidentifikasi tiga hal: <b>konteks</b>, <b>tujuan</b>, dan <b>topik</b>.</p>
    <p class="mute">Klik kartu di sebelah kanan untuk menjelajahi tiap unsur.</p></div>
    <div class="col grow"><div class="trio">${THEORY.map((x,i)=>`<button class="${i===S.th?'on':''}" onclick="setTh(${i})"><b>${x.t}</b><span>${x.k} · ${x.d}</span></button>`).join('')}</div>
    <div class="card grow"><h2>${t.t} (${t.k})</h2><div class="q">${t.q}</div><p>${t.ex}</p><h3>Kata petunjuk yang sering muncul</h3><div class="chips">${t.w.map(w=>`<span class="chip">${w}</span>`).join('')}</div></div></div>`}
  if(S.tab==='kuis'){v.innerHTML=kuisView();}if(S.tab==='prosedur'){const s=STEPS[S.st];
    v.innerHTML=`<div class="col grow"><div class="steps">${STEPS.map((x,i)=>`<button class="${i===S.st?'on':S.seen.includes(i)?'done':''}" onclick="setSt(${i})">${i+1}. ${x[0]}</button>`).join('')}</div>
    <div class="bar"><i style="width:${(S.seen.length/STEPS.length)*100}%"></i></div>
    <div class="card grow" style="display:flex;flex-direction:column;justify-content:center"><h2 style="font-size:32px">${s[0]}: ${s[1]}</h2><p class="big">${s[2]}</p><p class="big"><mark>Tips</mark> ${s[3]}</p></div>
    <div class="row"><button onclick="setSt(S.st-1)" ${S.st===0?'disabled':''}>◀ Sebelumnya</button><button class="pri" onclick="setSt(S.st+1)" ${S.st===STEPS.length-1?'disabled':''}>Berikutnya ▶</button><span class="mute" style="margin-left:auto">${S.seen.length} dari ${STEPS.length} langkah dibuka</span></div></div>`}
  if(S.tab==='lkpd'){const T=TEXTS[S.tx],a=S.ans[S.tx],c=S.chk[S.tx];
    const sc=a.filter((o,i)=>o===T.qs[i][3]).length;
    v.innerHTML=`<div class="card col left"><div class="sel">${TEXTS.map((x,i)=>`<button class="${i===S.tx?'on':''}" onclick="setTx(${i})">${i+1}. ${x.n}</button>`).join('')}</div>
    <div class="wave ${S.playing?'go':''}">${Array.from({length:22},(_,i)=>`<i style="animation-delay:${(i%7)*.09}s"></i>`).join('')}</div>
    <div class="row"><button class="pri" style="flex:1;font-size:17px" onclick="play()">${S.playing?'⏹ Berhenti':'▶ Putar audio'}</button><button onclick="showTr()">${S.tr[S.tx]?'Tutup':'Transkrip'}</button></div>
    <div class="tr grow" style="overflow:hidden">${S.tr[S.tx]?T.txt:'Dengarkan dua kali, lalu jawab pertanyaan. Transkrip dibuka bila perlu.'}${c?`<p style="margin-top:8px"><mark>${T.c}</mark></p>`:''}</div></div>
    <div class="col grow"><div class="qs card grow">${T.qs.map((q,i)=>`<div class="qb"><h3>${q[0]} — ${q[1]}</h3><div class="opts">${q[2].map((o,j)=>{let cl='';if(c){cl=j===q[3]?'ok':a[i]===j?'no':''}else if(a[i]===j)cl='sel1';return `<button class="${cl}" onclick="pick(${i},${j})">${o}</button>`}).join('')}</div></div>`).join('')}</div>
    <div class="row"><button class="pri" onclick="check()">✔ Periksa jawaban</button><button onclick="resetTx()">↺ Ulangi teks ini</button><span class="score" style="margin-left:auto">${c?`Skor teks ini: ${sc}/3 · `:''}Total: ${total()}/9</span></div></div>`}
}
const SEC=['1. Pengertian','2. Jenis teks lisan','3. Konteks, tujuan, topik','4. Ungkapan penting','5. Strategi menyimak','6. Kosakata kunci'];
const EX=[
 ['Menyapa & menarik perhatian','Membuka pembicaraan atau mengumumkan sesuatu.',['Good morning, everyone.','Attention, please.','Hello, this is …'],'“Attention, please.” → pengumuman akan dimulai.'],
 ['Memberi informasi','Memberi tahu waktu, tempat, atau kegiatan.',['I would like to inform you that …','There will be … at …','Please be informed that …'],'“There will be a speech contest on Friday.”'],
 ['Meminta tolong','Meminta orang lain melakukan sesuatu.',['Could you please …?','Would you mind …?','Can you help me …?'],'“Could you please heat up the rice?”'],
 ['Menawarkan','Menawarkan bantuan, barang, atau diskon.',['Would you like …?','We have a special offer on …','Let me help you.'],'“Apples are thirty percent off.”'],
 ['Mengingatkan','Mengingatkan agar tidak lupa atau terlambat.',['Don’t forget to …','Please remember to …','Please be on time.'],'“Please bring your notebooks.”'],
 ['Berterima kasih & merespons','Menutup pembicaraan dan menanggapi lawan bicara.',['Thank you. / Thanks, dear.','You’re welcome.','No problem. / I see.'],'“Thank you.” → penutup pengumuman.']
];
const VOC=[['announcement','pengumuman'],['gather','berkumpul'],['inform','memberi tahu'],['invite','mengundang'],['remind','mengingatkan'],['special offer','penawaran khusus'],['be on time','tepat waktu'],['stuck in traffic','terjebak macet'],['principal','kepala sekolah'],['section','bagian / area'],['heat up','menghangatkan'],['percent off','diskon … persen']];
function setSec(i){S.sec=i;sfx.tab();render()}
function setEx(i){S.ex=i;sfx.click();render()}
function flip(i){const k=S.fl.indexOf(i);if(k<0)S.fl.push(i);else S.fl.splice(k,1);sfx.click();render()}
function teoriView(){
 const side=`<div class="side">${SEC.map((s,i)=>`<button class="${i===S.sec?'on':''}" onclick="setSec(${i})">${s}</button>`).join('')}</div>`;
 let h='';
 if(S.sec===0)h=`<div class="card grow"><h2>Pengertian spoken text</h2><p><mark>Spoken text</mark> adalah teks lisan, yaitu pesan yang disampaikan melalui suara dan dipahami dengan menyimak. Contohnya percakapan, pengumuman, pesan telepon, pidato, dan siaran berita.</p><h3>Ciri-ciri utama</h3><div class="chips">${['Disampaikan lewat suara','Ada intonasi dan tekanan kata','Bahasa cenderung informal','Ada jeda dan pengulangan','Bergantung pada situasi'].map(c=>`<span class="chip">${c}</span>`).join('')}</div><h3 style="margin-top:18px">Spoken text dan written text</h3><table class="tbl"><tr><th>Aspek</th><th>Spoken text</th><th>Written text</th></tr><tr><td>Media</td><td>Suara, didengar</td><td>Tulisan, dibaca</td></tr><tr><td>Bahasa</td><td>Singkat, sering informal</td><td>Formal dan tertata</td></tr><tr><td>Petunjuk makna</td><td>Intonasi, tekanan, jeda</td><td>Tanda baca, huruf besar</td></tr><tr><td>Pengulangan</td><td>Hanya jika direkam atau diminta</td><td>Bisa dibaca ulang kapan saja</td></tr></table></div>`;
 if(S.sec===1)h=`<div class="g3">${[['Monolog','Satu pembicara menyampaikan pesan kepada pendengar.','school announcement, speech, news report','Tanpa tanggapan langsung; ide tersusun urut; diawali sapaan seperti “Attention, please”.'],['Dialog','Dua orang atau lebih berbicara bergantian.','conversation, phone call, interview','Ada tanya-jawab; ada respons seperti “I see” dan “Really?”; pembicara bergantian.'],['Pesan rekaman & iklan','Pesan yang direkam atau disiarkan di tempat umum.','voicemail, store offer, station call','Kalimat pendek; sering diulang; memuat waktu, tempat, atau harga.']].map(x=>`<div class="card"><h2>${x[0]}</h2><p>${x[1]}</p><h3>Contoh</h3><p>${x[2]}</p><h3>Ciri</h3><p>${x[3]}</p></div>`).join('')}</div><div class="card"><p style="margin:0"><mark>Tips cepat</mark> Hitung jumlah pembicara. Satu pembicara berarti monolog, dua atau lebih berarti dialog. Pesan yang dibuat untuk umum biasanya berupa pengumuman atau iklan.</p></div>`;
 if(S.sec===2){const t=THEORY[S.th];h=`<div class="trio">${THEORY.map((x,i)=>`<button class="${i===S.th?'on':''}" onclick="setTh(${i})"><b>${x.t}</b><span>${x.k} · ${x.d}</span></button>`).join('')}</div><div class="card grow"><h2>${t.t} (${t.k})</h2><div class="q">${t.q}</div><p>${t.ex}</p><h3>Kata petunjuk yang sering muncul</h3><div class="chips">${t.w.map(w=>`<span class="chip">${w}</span>`).join('')}</div><p style="margin-top:14px" class="mute">Ketiganya dicari bersamaan: dengarkan sekali untuk topik, lalu sekali lagi untuk konteks dan tujuan.</p></div>`}
 if(S.sec===3){const e=EX[S.ex];h=`<div class="grow" style="display:flex;gap:18px;min-height:0"><div class="exl">${EX.map((x,i)=>`<button class="${i===S.ex?'on':''}" onclick="setEx(${i})">${x[0]}</button>`).join('')}</div><div class="card grow"><h2>${e[0]}</h2><p class="mute">${e[1]}</p><h3>Ungkapan</h3><ul class="l">${e[2].map(x=>`<li>${x}</li>`).join('')}</ul><div class="q" style="margin-top:16px">Contoh: ${e[3]}</div></div></div>`}
 if(S.sec===4)h=`<div class="grow" style="display:flex;gap:18px;min-height:0"><div class="card" style="width:470px;flex:none"><h2>Tiga tahap menyimak</h2><h3>Sebelum</h3><ul class="l"><li>Lihat judul atau situasi, lalu prediksi isinya.</li></ul><h3 style="margin-top:10px">Saat</h3><ul class="l"><li>Dengar I: tangkap topik utama.</li><li>Dengar II: cari konteks dan tujuan.</li><li>Catat kata kunci, angka, nama, dan waktu.</li><li>Perhatikan intonasi dan tekanan kata.</li></ul><h3 style="margin-top:10px">Sesudah</h3><ul class="l"><li>Pilih jawaban yang punya bukti dari audio.</li><li>Dengarkan ulang bagian yang belum jelas.</li></ul></div><div class="card grow"><h2>Kalimat petunjuk</h2><table class="tbl"><tr><th>Yang terdengar</th><th>Artinya</th></tr><tr><td>“Attention, please.”</td><td>Pengumuman; tujuan memberi informasi</td></tr><tr><td>“Hello, this is …”</td><td>Percakapan telepon</td></tr><tr><td>“Welcome to …”</td><td>Tempat umum, menyambut atau menawarkan</td></tr><tr><td>“Could you please …?”</td><td>Tujuan meminta tolong</td></tr><tr><td>“Don’t forget to …”</td><td>Tujuan mengingatkan</td></tr><tr><td>“Thank you for …”</td><td>Berterima kasih, biasanya penutup</td></tr></table></div></div>`;
 if(S.sec===5)h=`<div class="card grow"><h2>Kosakata kunci</h2><p class="mute">Klik kartu untuk melihat arti. Terbuka: ${S.fl.length} dari ${VOC.length}.</p><div class="g4">${VOC.map((w,i)=>`<button class="fc ${S.fl.includes(i)?'on':''}" onclick="flip(${i})">${S.fl.includes(i)?w[1]:w[0]}</button>`).join('')}</div></div>`;
 return side+`<div class="col grow">${h}</div>`}
const QZ=[
 ['Apa yang dimaksud dengan spoken text?',['Teks yang disampaikan lewat suara','Teks yang hanya untuk dibaca','Teks berupa gambar dan diagram'],0,'Spoken text disampaikan melalui suara dan dipahami dengan menyimak.'],
 ['Satu pembicara menyampaikan pesan kepada pendengar, misalnya pengumuman sekolah. Jenis teksnya adalah …',['Dialog','Monolog','Wawancara'],1,'Satu pembicara berarti monolog; dua pembicara atau lebih berarti dialog.'],
 ['Ungkapan mana yang dipakai untuk meminta tolong?',['Thank you very much.','Attention, please.','Could you please close the door?'],2,'“Could you please …?” adalah ungkapan meminta tolong.'],
 ['Pertanyaan “Why does the speaker say this?” menanyakan unsur …',['Konteks','Tujuan','Topik'],1,'Tujuan menjawab mengapa pembicara mengatakan sesuatu.'],
 ['Pada saat mendengarkan pertama (Dengar I), hal yang paling dulu ditangkap adalah …',['Topik utama','Ejaan setiap kata','Nama pembicara'],0,'Dengar I untuk gambaran umum, yaitu topik. Konteks dan tujuan dicari pada Dengar II.'],
 ['Dengarkan audio. Apa tujuan pembicara?',['To thank students','To invite students','To remind students'],2,'Ungkapan “Don’t forget to …” menunjukkan tujuan mengingatkan.','Don’t forget to bring your English book tomorrow, class.'],
 ['Dengarkan audio. Di mana percakapan ini terjadi?',['In a classroom','In a phone call','In a shop'],1,'“Hello, this is …” dan “May I speak to …?” adalah ciri percakapan telepon.','Hello, this is Rani. May I speak to Mr. Budi, please?'],
 ['Kalimat mana yang menandakan sebuah pengumuman?',['Attention, please.','See you later.','Good night.'],0,'“Attention, please.” menarik perhatian pendengar sebelum informasi disampaikan.']
];
function qPick(j){if(S.qa[S.qi]!==undefined)return;stopSpeech();S.qa[S.qi]=j;if(j===QZ[S.qi][2])sfx.ok();else sfx.bad();render()}
function qNext(){S.qi++;if(S.qi>=QZ.length){const sc=QZ.filter((q,i)=>S.qa[i]===q[2]).length;if(sc>=6)sfx.win();else sfx.ok()}else sfx.click();render()}
function qRestart(){stopSpeech();S.qi=0;S.qa=[];sfx.reset();render()}
function qPlay(){sfx.click();if(!('speechSynthesis' in window)){toast('Suara tidak didukung peramban');return}const u=new SpeechSynthesisUtterance(QZ[S.qi][4]);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
function kuisView(){
 const n=QZ.length,right=QZ.filter((q,i)=>S.qa[i]===q[2]).length;
 if(S.qi>=n)return `<div class="card grow" style="display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px"><h2 style="font-size:36px">Skor akhir: ${right}/${n}</h2><p class="big">${right===n?'Sempurna! Kamu sudah memahami spoken text.':right>=6?'Bagus! Buka lagi tab Teori untuk soal yang masih meleset.':'Pelajari lagi tab Teori dan Prosedur, lalu coba kuis ini kembali.'}</p><button class="pri" style="font-size:18px;padding:12px 28px" onclick="qRestart()">↺ Ulangi kuis</button></div>`;
 const q=QZ[S.qi],a=S.qa[S.qi],ans=a!==undefined;
 return `<div class="col grow"><div class="row"><span class="score">Soal ${S.qi+1} dari ${n}</span><div class="bar" style="flex:1"><i style="width:${S.qi/n*100}%"></i></div></div><div class="card grow" style="display:flex;flex-direction:column;gap:14px"><h2 style="font-size:26px;margin:0">${q[0]}</h2>${q[4]?`<div class="row"><button class="pri" onclick="qPlay()">▶ Putar audio</button><span class="mute">Dengarkan, lalu pilih jawaban.</span></div>`:''}<div class="qopts">${q[1].map((o,j)=>`<button class="${ans?(j===q[2]?'ok':a===j?'no':''):''}" onclick="qPick(${j})">${o}</button>`).join('')}</div>${ans?`<div class="q">${a===q[2]?'Benar! ':'Belum tepat. '}${q[3]}${q[4]?' Transkrip: '+q[4]:''}</div>`:''}</div><div class="row"><button class="pri" onclick="qNext()" ${ans?'':'disabled'}>${S.qi===n-1?'Lihat skor':'Soal berikutnya ▶'}</button><button onclick="qRestart()">↺ Ulangi kuis</button><span class="score" style="margin-left:auto">Benar sejauh ini: ${right}</span></div></div>`}
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();render();
/* splash */
sfx.start=()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',i*.09))};
function goSplash(){stopSpeech();sfx.click();const s=document.getElementById('splash');document.getElementById('spLoad').hidden=true;const b=document.getElementById('spStart');b.hidden=false;document.getElementById('spMute').textContent=S.mute?'🔇':'🔊';s.hidden=false;requestAnimationFrame(()=>{s.classList.remove('out');b.focus()})}
function startApp(){sfx.start();const s=document.getElementById('splash');s.classList.add('out');setTimeout(()=>{s.hidden=true},600)}
(function(){
 const img=document.getElementById('spImg'),fill=document.getElementById('spFill'),pct=document.getElementById('spPct');
 let imgOk=img.complete&&img.naturalWidth>0,fontOk=false,p=0;
 if(!imgOk){img.onload=img.onerror=()=>{imgOk=true}}
 (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{fontOk=true});
 setTimeout(()=>{imgOk=true;fontOk=true},4000);
 function ready(){document.getElementById('spLoad').hidden=true;const b=document.getElementById('spStart');b.hidden=false;b.focus()}
 function step(){
  const tgt=10+(imgOk?60:0)+(fontOk?30:0);
  p=Math.min(tgt,p+Math.max(.8,(tgt-p)*.06));
  fill.style.width=p+'%';pct.textContent=Math.floor(p)+'%';
  if(p>=100){ready();return}
  requestAnimationFrame(step)}
 requestAnimationFrame(step);
})();

</script>
